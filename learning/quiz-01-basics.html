<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз · Розділ 1 — Основи CI/CD</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470;
    --line:#e3e7ec; --brand:#2f6fed; --brand-ink:#fff;
    --ok:#1a7f4b; --ok-bg:#e7f6ee; --bad:#c02626; --bad-bg:#fdeaea;
    --chip:#eef1f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --ink:#e8ebef; --muted:#9aa4b2;
      --line:#262c34; --brand:#5b8bff; --brand-ink:#0b0e12;
      --ok:#4fd08a; --ok-bg:#12301f; --bad:#ff7b7b; --bad-bg:#331515;
      --chip:#222833;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px;}
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:20px}
  .kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
  h1{font-size:26px;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0}
  .bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:18px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  .barlabel{font-size:13px;color:var(--muted)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px;margin:16px 0;
     box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qnum{font-size:13px;color:var(--muted);font-weight:600}
  .qtext{font-weight:650;margin:4px 0 14px;font-size:17px}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;margin:8px 0;cursor:pointer;color:var(--ink);font:inherit;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--brand)}
  .opt:disabled{cursor:default}
  .opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .mk{border-color:var(--bad);background:var(--bad);color:#fff}
  .explain{font-size:14.5px;color:var(--muted);background:var(--chip);border-radius:10px;
    padding:10px 13px;margin:6px 0 14px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--ink)}
  .result{position:sticky;bottom:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-top:20px;box-shadow:0 6px 20px rgba(0,0,0,.10);
    display:none}
  .result.show{display:block}
  .result h2{margin:0 0 4px;font-size:20px}
  .result p{margin:0;color:var(--muted)}
  .score{font-size:34px;font-weight:800;color:var(--brand)}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Розділ 1 · Квіз</div>
    <h1>Основи CI/CD та GitHub Actions</h1>
    <p class="sub">8 питань · обери один варіант · пояснення з'явиться одразу</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="barlabel"><span id="answered">0</span>/8 відповіли · правильних: <span id="correct">0</span></div>
  </header>
  <main id="quiz"></main>
  <div class="result" id="result">
    <div class="score"><span id="finalScore">0</span>/8</div>
    <h2 id="verdict"></h2>
    <p id="advice"></p>
  </div>
  <footer>learning/quiz-01-basics.html · курс CI/CD для .NET</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Що означає абревіатура CI у «CI/CD»?",
    opts: ["Continuous Integration", "Code Inspection", "Continuous Installation", "Central Integration"],
    correct: 0,
    ex: "<b>Continuous Integration</b> — безперервна інтеграція: розробники часто вливають свій код у спільну гілку, і кожна зміна автоматично збирається та тестується."
  },
  {
    q: "У чому головна мета Continuous Integration?",
    opts: ["Автоматично збирати й тестувати кожну зміну, щоб ловити помилки рано",
           "Автоматично деплоїти код у продакшн",
           "Генерувати документацію з коду",
           "Керувати версіями сторонніх бібліотек"],
    correct: 0,
    ex: "Суть CI — <b>швидкий зворотний зв'язок</b>. Проблему видно за хвилини після коміту, а не через тиждень при релізі. Деплой — це вже зона CD."
  },
  {
    q: "Чим відрізняються Continuous Delivery і Continuous Deployment?",
    opts: ["Delivery: реліз завжди готовий, а деплой запускають вручну; Deployment: деплой у прод автоматичний",
           "Це два різні написи одного й того самого",
           "Delivery деплоїть автоматично, а Deployment — вручну",
           "Deployment стосується лише міграцій бази даних"],
    correct: 0,
    ex: "Обидва — це «CD». Різниця у фінальному кроці: <b>Delivery</b> = готово до релізу, кнопку тисне людина; <b>Deployment</b> = кожна зелена зміна їде в прод сама."
  },
  {
    q: "У якій папці репозиторію GitHub шукає файли workflow?",
    opts: [".github/workflows/", "у корені репозиторію", ".git/workflows/", "actions/"],
    correct: 0,
    ex: "Строго <b>.github/workflows/</b> — саме там лежить твій <code>ci.yml</code>. Папка <code>.git/</code> — службова для самого Git, це зовсім інше."
  },
  {
    q: "Що таке «runner» у GitHub Actions?",
    opts: ["Віртуальна машина, на якій виконуються кроки workflow",
           "Розробник, що вручну запускає пайплайн",
           "Розширення для VS Code",
           "Ще одна назва для YAML-файлу"],
    correct: 0,
    ex: "<b>Runner</b> — це чиста ВМ (напр. <code>ubuntu-latest</code>), яку GitHub піднімає під твій job, виконує кроки й гасить. Тому код спершу треба на неї склонувати (checkout)."
  },
  {
    q: "У чому різниця між `uses:` та `run:` у кроці (step)?",
    opts: ["`uses:` підключає готову action (перевикористовуваний блок); `run:` виконує shell-команду",
           "`uses:` — для змінних, `run:` — для секретів",
           "Різниці немає, це синоніми",
           "`run:` підключає action, а `uses:` виконує команду"],
    correct: 0,
    ex: "<b>uses:</b> бере чужий готовий крок (<code>actions/checkout@v4</code>). <b>run:</b> просто виконує команду в терміналі runner-а (<code>dotnet build</code>)."
  },
  {
    q: "Що робить крок `uses: actions/checkout@v4` у твоєму ci.yml?",
    opts: ["Клонує код репозиторію на runner, щоб з ним можна було працювати",
           "Встановлює .NET SDK",
           "Запускає юніт-тести",
           "Деплоїть застосунок у прод"],
    correct: 0,
    ex: "Runner стартує порожнім. <b>checkout</b> завантажує (клонує) твій код на цю ВМ — інакше <code>dotnet restore</code> не мав би що збирати."
  },
  {
    q: "За що відповідає секція `on:` у workflow-файлі?",
    opts: ["Визначає події, які запускають workflow (push, pull_request тощо)",
           "Перелічує залежності проєкту",
           "Задає назву workflow",
           "Обирає мову програмування"],
    correct: 0,
    ex: "<b>on:</b> — це тригери. У тебе там <code>push</code> і <code>pull_request</code> у гілку <code>main</code>: workflow спрацює на кожен такий push і на кожен PR."
  }
];

const quiz = document.getElementById('quiz');
let answered = 0, correct = 0;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

QUESTIONS.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'q';
  card.innerHTML = `<div class="qnum">Питання ${qi+1} з ${QUESTIONS.length}</div>
                    <div class="qtext">${item.q}</div>`;
  const letters = ['A','B','C','D'];
  const options = shuffle(item.opts.map((text, i) => ({text, correct: i === item.correct})));
  options.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.correct = opt.correct ? "1" : "0";
    btn.innerHTML = `<span class="mk">${letters[oi]}</span><span>${opt.text}</span>`;
    btn.onclick = () => choose(card, opt.correct, btn);
    card.appendChild(btn);
  });
  const ex = document.createElement('div');
  ex.className = 'explain';
  ex.innerHTML = item.ex;
  card.appendChild(ex);
  quiz.appendChild(card);
});

function choose(card, isCorrect, btn){
  if (card.dataset.done) return;
  card.dataset.done = "1";
  answered++;
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === "1") b.classList.add('correct');
  });
  if (isCorrect){ correct++; }
  else { btn.classList.add('wrong'); }
  card.querySelector('.explain').classList.add('show');
  update();
}

function update(){
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct').textContent = correct;
  document.getElementById('fill').style.width = (answered/QUESTIONS.length*100)+'%';
  if (answered === QUESTIONS.length) finish();
}

function finish(){
  const r = document.getElementById('result');
  document.getElementById('finalScore').textContent = correct;
  let verdict, advice;
  if (correct === 8){ verdict = "Ідеально! 🎯"; advice = "Повне попадання. Можна сміливо йти в Розділ 2 — анатомію workflow-файлу."; }
  else if (correct >= 6){ verdict = "Дуже добре! 👍"; advice = "Основа міцна. Переглянь пояснення до пропущених питань — і рушаємо далі."; }
  else if (correct >= 4){ verdict = "Непогано, але повтори 📘"; advice = "Половина є. Перечитай пояснення до червоних відповідей перед Розділом 2."; }
  else { verdict = "Варто перечитати розділ 🔁"; advice = "Це нормально на старті. Пробіжись по теорії з чату ще раз і перепройди квіз."; }
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('advice').textContent = advice;
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth', block:'center'});
}
</script>
</body>
</html>
