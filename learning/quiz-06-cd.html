<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз · Розділ 6 — CD та деплой</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470;
    --line:#e3e7ec; --brand:#2f6fed; --brand-ink:#fff;
    --ok:#1a7f4b; --ok-bg:#e7f6ee; --bad:#c02626; --bad-bg:#fdeaea;
    --chip:#eef1f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --ink:#e8ebef; --muted:#9aa4b2;
      --line:#262c34; --brand:#5b8bff; --brand-ink:#0b0e12;
      --ok:#4fd08a; --ok-bg:#12301f; --bad:#ff7b7b; --bad-bg:#331515;
      --chip:#222833;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px;}
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:20px}
  .kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
  h1{font-size:26px;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0}
  .bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:18px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  .barlabel{font-size:13px;color:var(--muted)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px;margin:16px 0;
     box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qnum{font-size:13px;color:var(--muted);font-weight:600}
  .qtext{font-weight:650;margin:4px 0 14px;font-size:17px}
  code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.92em}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;margin:8px 0;cursor:pointer;color:var(--ink);font:inherit;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--brand)}
  .opt:disabled{cursor:default}
  .opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .mk{border-color:var(--bad);background:var(--bad);color:#fff}
  .explain{font-size:14.5px;color:var(--muted);background:var(--chip);border-radius:10px;
    padding:10px 13px;margin:6px 0 14px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--ink)}
  .result{position:sticky;bottom:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-top:20px;box-shadow:0 6px 20px rgba(0,0,0,.10);
    display:none}
  .result.show{display:block}
  .result h2{margin:0 0 4px;font-size:20px}
  .result p{margin:0;color:var(--muted)}
  .score{font-size:34px;font-weight:800;color:var(--brand)}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Розділ 6 · Квіз</div>
    <h1>CD — деплой, secrets, environments</h1>
    <p class="sub">8 питань · обери один варіант · пояснення з'явиться одразу</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="barlabel"><span id="answered">0</span>/8 відповіли · правильних: <span id="correct">0</span></div>
  </header>
  <main id="quiz"></main>
  <div class="result" id="result">
    <div class="score"><span id="finalScore">0</span>/8</div>
    <h2 id="verdict"></h2>
    <p id="advice"></p>
  </div>
  <footer>learning/quiz-06-cd.html · курс CI/CD для .NET</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Що CD (деплой) додає поверх CI?",
    opts: ["Бере перевірений артефакт і доставляє/розгортає його в цільове середовище",
           "Компілює вихідний код у .dll",
           "Пише за тебе юніт-тести",
           "Створює новий репозиторій на GitHub"],
    correct: 0,
    ex: "CI закінчується <b>перевіреним артефактом</b>. CD бере саме його й доставляє: на сервер, у хмару, в контейнерний реєстр. Ланцюжок build → test → publish → <b>deploy</b>."
  },
  {
    q: "Як окремому job-у деплою дочекатися job-а збірки й отримати його артефакт?",
    opts: ["Оголосити `needs: build` і завантажити артефакт через `download-artifact`",
           "Нічого не треба — jobs автоматично бачать файли одне одного",
           "Передати файли через `actions/cache`",
           "Скопіювати файли між runner-ами через scp"],
    correct: 0,
    ex: "Jobs ізольовані. <b>needs: build</b> робить deploy залежним (і він піде лише якщо build зелений), а <b>download-artifact</b> витягує саме перевірену папку publish."
  },
  {
    q: "Де правильно тримати паролі/токени/ключі для деплою?",
    opts: ["У GitHub Secrets, звертаючись до них через ${{ secrets.NAME }}",
           "Прямо в тексті yaml-файлу",
           "У файлі README поруч із інструкцією",
           "У назві гілки або комміту"],
    correct: 0,
    ex: "Секрети зберігають у Settings → Secrets and variables → Actions, а в workflow читають як <b>${{ secrets.NAME }}</b>. Вони маскуються в логах. Хардкодити ключі в yaml — груба помилка безпеки."
  },
  {
    q: "Що таке «environment» (напр. `production`) у GitHub Actions?",
    opts: ["Іменована ціль деплою з власними правилами захисту та секретами",
           "Змінна оточення операційної системи",
           "Різновид self-hosted runner-а",
           "Версія .NET, під яку білдять"],
    correct: 0,
    ex: "<b>Environment</b> (staging/production) — це логічна ціль деплою. Їй можна дати власні секрети та правила: хто і за яких умов туди деплоїть."
  },
  {
    q: "Яке правило environment реалізує саме «Continuous Delivery» — деплой за ручним підтвердженням?",
    opts: ["Required reviewers — деплой чекає на схвалення людини перед запуском",
           "cancel-in-progress у concurrency",
           "strategy: matrix",
           "retention-days для артефакту"],
    correct: 0,
    ex: "<b>Required reviewers</b> ставить деплой «на паузу» до кліку відповідальної людини. Це і є різниця між Delivery (кнопка людини) і Deployment (автоматично)."
  },
  {
    q: "Що таке `GITHUB_TOKEN` у workflow?",
    opts: ["Автоматичний токен кожного прогону для доступу до репо/пакетів за принципом найменших привілеїв",
           "Твій особистий пароль від акаунта GitHub",
           "Секрет, який обов'язково треба створити вручну",
           "Ключ доступу до продакшн-бази даних"],
    correct: 0,
    ex: "GitHub сам видає <b>GITHUB_TOKEN</b> на час прогону — ним, напр., пушать у GHCR чи коментують PR. Його права звужують блоком <code>permissions:</code>."
  },
  {
    q: "Навіщо у workflow блок `permissions:`?",
    opts: ["Обмежити права GITHUB_TOKEN до мінімально потрібних (least privilege)",
           "Перелічити всі секрети проєкту",
           "Обрати операційну систему runner-а",
           "Увімкнути кешування NuGet"],
    correct: 0,
    ex: "<b>permissions:</b> звужує токен: напр. <code>contents: read</code> + <code>packages: write</code>. Менше прав — менша шкода, якщо workflow скомпрометують. Для хмари краще OIDC (короткоживучі токени) замість вічних секретів."
  },
  {
    q: "Як зробити, щоб деплой запускався вручну (кнопкою), а не на кожен push?",
    opts: ["Додати тригер `workflow_dispatch` (і/або схвалення в environment)",
           "Видалити всі jobs, крім deploy",
           "Прибрати runner із конфігурації",
           "Замінити deploy на matrix"],
    correct: 0,
    ex: "<b>workflow_dispatch</b> додає кнопку «Run workflow» в UI — ручний запуск. У парі з required reviewers на environment це дає контрольований, «людський» деплой."
  }
];

const quiz = document.getElementById('quiz');
let answered = 0, correct = 0;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

QUESTIONS.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'q';
  card.innerHTML = `<div class="qnum">Питання ${qi+1} з ${QUESTIONS.length}</div>
                    <div class="qtext">${item.q}</div>`;
  const letters = ['A','B','C','D'];
  const options = shuffle(item.opts.map((text, i) => ({text, correct: i === item.correct})));
  options.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.correct = opt.correct ? "1" : "0";
    btn.innerHTML = `<span class="mk">${letters[oi]}</span><span>${opt.text}</span>`;
    btn.onclick = () => choose(card, opt.correct, btn);
    card.appendChild(btn);
  });
  const ex = document.createElement('div');
  ex.className = 'explain';
  ex.innerHTML = item.ex;
  card.appendChild(ex);
  quiz.appendChild(card);
});

function choose(card, isCorrect, btn){
  if (card.dataset.done) return;
  card.dataset.done = "1";
  answered++;
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === "1") b.classList.add('correct');
  });
  if (isCorrect){ correct++; }
  else { btn.classList.add('wrong'); }
  card.querySelector('.explain').classList.add('show');
  update();
}

function update(){
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct').textContent = correct;
  document.getElementById('fill').style.width = (answered/QUESTIONS.length*100)+'%';
  if (answered === QUESTIONS.length) finish();
}

function finish(){
  const r = document.getElementById('result');
  document.getElementById('finalScore').textContent = correct;
  let verdict, advice;
  if (correct === 8){ verdict = "Ідеально! 🎯"; advice = "Ти розумієш деплой і безпеку секретів. Далі — фінальний Розділ 7: best practices + cheatsheet."; }
  else if (correct >= 6){ verdict = "Дуже добре! 👍"; advice = "Механіку CD засвоєно. Глянь пропущені пояснення і рушаємо в Розділ 7."; }
  else if (correct >= 4){ verdict = "Непогано, повтори 📘"; advice = "Перечитай про needs+download-artifact, secrets і environments."; }
  else { verdict = "Варто перечитати розділ 🔁"; advice = "Деплой і секрети — критична тема. Пробіжись по теорії ще раз."; }
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('advice').textContent = advice;
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth', block:'center'});
}
</script>
</body>
</html>
