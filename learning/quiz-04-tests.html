<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз · Розділ 4 — Тести в CI</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5b6470;
    --line:#e3e7ec; --brand:#2f6fed; --brand-ink:#fff;
    --ok:#1a7f4b; --ok-bg:#e7f6ee; --bad:#c02626; --bad-bg:#fdeaea;
    --chip:#eef1f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --ink:#e8ebef; --muted:#9aa4b2;
      --line:#262c34; --brand:#5b8bff; --brand-ink:#0b0e12;
      --ok:#4fd08a; --ok-bg:#12301f; --bad:#ff7b7b; --bad-bg:#331515;
      --chip:#222833;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px;}
  .wrap{max-width:760px;margin:0 auto;}
  header{margin-bottom:20px}
  .kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
  h1{font-size:26px;margin:6px 0 4px}
  .sub{color:var(--muted);margin:0}
  .bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:18px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  .barlabel{font-size:13px;color:var(--muted)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px;margin:16px 0;
     box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qnum{font-size:13px;color:var(--muted);font-weight:600}
  .qtext{font-weight:650;margin:4px 0 14px;font-size:17px}
  code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.92em}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;margin:8px 0;cursor:pointer;color:var(--ink);font:inherit;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--brand)}
  .opt:disabled{cursor:default}
  .opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .mk{border-color:var(--bad);background:var(--bad);color:#fff}
  .explain{font-size:14.5px;color:var(--muted);background:var(--chip);border-radius:10px;
    padding:10px 13px;margin:6px 0 14px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--ink)}
  .result{position:sticky;bottom:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-top:20px;box-shadow:0 6px 20px rgba(0,0,0,.10);
    display:none}
  .result.show{display:block}
  .result h2{margin:0 0 4px;font-size:20px}
  .result p{margin:0;color:var(--muted)}
  .score{font-size:34px;font-weight:800;color:var(--brand)}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Розділ 4 · Квіз</div>
    <h1>Тести в CI (xUnit + matrix)</h1>
    <p class="sub">8 питань · обери один варіант · пояснення з'явиться одразу</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="barlabel"><span id="answered">0</span>/8 відповіли · правильних: <span id="correct">0</span></div>
  </header>
  <main id="quiz"></main>
  <div class="result" id="result">
    <div class="score"><span id="finalScore">0</span>/8</div>
    <h2 id="verdict"></h2>
    <p id="advice"></p>
  </div>
  <footer>learning/quiz-04-tests.html · курс CI/CD для .NET</footer>
</div>
<script>
const QUESTIONS = [
  {
    q: "Яка головна причина ганяти тести саме в CI, а не лише локально?",
    opts: ["Кожну зміну автоматично перевіряють, і зламані тести блокують мердж у всіх однаково",
           "Щоб швидше компілювати код",
           "Щоб зменшити розмір репозиторію",
           "Тести в CI не потрібні — досить того, що працює локально"],
    correct: 0,
    ex: "CI дає <b>єдину незалежну перевірку</b>: не «в мене працює», а «працює на чистому runner-і». Червоні тести валять job і не дають влити поламаний код."
  },
  {
    q: "Де в .NET-проєкті прийнято тримати тести?",
    opts: ["В окремому тестовому проєкті, що посилається на основний",
           "У тих самих файлах, що й робочий код",
           "У папці bin/ поруч зі скомпільованими dll",
           "Прямо в .github/workflows/"],
    correct: 0,
    ex: "Тести — це <b>окремий проєкт</b> (напр. <code>tests/Api.Tests</code>) з посиланням на основний. Так тестовий код і фреймворки не потрапляють у продакшн-збірку."
  },
  {
    q: "Який із цих — популярний тест-фреймворк саме для .NET?",
    opts: ["xUnit", "Jest", "JUnit", "PyTest"],
    correct: 0,
    ex: "<b>xUnit</b> (а також NUnit і MSTest) — це .NET. Jest — JavaScript, JUnit — Java, PyTest — Python. Створити проєкт: <code>dotnet new xunit -o tests/Api.Tests</code>."
  },
  {
    q: "Що станеться з CI job, якщо хоча б один тест впаде під час `dotnet test`?",
    opts: ["Команда поверне ненульовий код виходу → крок і весь job стануть червоними",
           "Нічого, job усе одно буде зеленим",
           "Job автоматично перезапуститься",
           "Впаде тільки якщо додати окремий прапорець"],
    correct: 0,
    ex: "Це і є суть CI: <b>ненульовий exit code</b> = провал кроку = червоний job. GitHub позначить комміт/PR як такий, що не пройшов перевірку."
  },
  {
    q: "Навіщо `dotnet test --no-build`, якщо крок Build уже був раніше?",
    opts: ["Тестовий проєкт уже зібрано на кроці Build — не перезбираємо його вдруге",
           "Щоб пропустити самі тести",
           "Щоб примусово зібрати в Debug",
           "Щоб не завантажувати NuGet-пакети"],
    correct: 0,
    ex: "Якщо на кроці Build зібралося все рішення (разом із тестовим проєктом), то <b>--no-build</b> дає test-у лише прогнати тести. Важливо: тоді build має збирати й тестовий проєкт."
  },
  {
    q: "Що таке `strategy: matrix` у GitHub Actions?",
    opts: ["Спосіб запустити один job у кількох комбінаціях (ОС, версії) паралельно",
           "Список секретів для деплою",
           "Матриця прав доступу до репозиторію",
           "Різновид self-hosted runner-а"],
    correct: 0,
    ex: "<b>matrix</b> розмножує job на всі комбінації заданих значень і ганяє їх паралельно. Класика — перевірити код на кількох ОС і/або версіях .NET одразу."
  },
  {
    q: "Скільки job-ів створить matrix з `os: [ubuntu-latest, windows-latest]` та `dotnet: ['8.0.x','10.0.x']`?",
    opts: ["4 — усі комбінації (2 × 2)", "2", "1", "8"],
    correct: 0,
    ex: "Matrix бере <b>декартів добуток</b>: 2 ОС × 2 версії = <b>4</b> паралельні job-и. Зайві комбінації можна прибрати через <code>exclude</code>, а додати особливі — через <code>include</code>."
  },
  {
    q: "Як усередині workflow звернутися до поточного значення матриці, напр. ОС?",
    opts: ["${{ matrix.os }}", "$os", "{{ os }}", "matrix(os)"],
    correct: 0,
    ex: "Значення матриці читають виразом <b>${{ matrix.&lt;ключ&gt; }}</b>, напр. <code>runs-on: ${{ matrix.os }}</code>. Це та сама синтаксис-обгортка <code>${{ }}</code>, що й для секретів чи <code>runner.os</code>."
  }
];

const quiz = document.getElementById('quiz');
let answered = 0, correct = 0;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

QUESTIONS.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'q';
  card.innerHTML = `<div class="qnum">Питання ${qi+1} з ${QUESTIONS.length}</div>
                    <div class="qtext">${item.q}</div>`;
  const letters = ['A','B','C','D'];
  const options = shuffle(item.opts.map((text, i) => ({text, correct: i === item.correct})));
  options.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.correct = opt.correct ? "1" : "0";
    btn.innerHTML = `<span class="mk">${letters[oi]}</span><span>${opt.text}</span>`;
    btn.onclick = () => choose(card, opt.correct, btn);
    card.appendChild(btn);
  });
  const ex = document.createElement('div');
  ex.className = 'explain';
  ex.innerHTML = item.ex;
  card.appendChild(ex);
  quiz.appendChild(card);
});

function choose(card, isCorrect, btn){
  if (card.dataset.done) return;
  card.dataset.done = "1";
  answered++;
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === "1") b.classList.add('correct');
  });
  if (isCorrect){ correct++; }
  else { btn.classList.add('wrong'); }
  card.querySelector('.explain').classList.add('show');
  update();
}

function update(){
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct').textContent = correct;
  document.getElementById('fill').style.width = (answered/QUESTIONS.length*100)+'%';
  if (answered === QUESTIONS.length) finish();
}

function finish(){
  const r = document.getElementById('result');
  document.getElementById('finalScore').textContent = correct;
  let verdict, advice;
  if (correct === 8){ verdict = "Ідеально! 🎯"; advice = "Тести під контролем. Далі — Розділ 5: артефакти й публікація (dotnet publish + upload-artifact)."; }
  else if (correct >= 6){ verdict = "Дуже добре! 👍"; advice = "Головне засвоєно. Глянь пропущені пояснення і рушаємо в Розділ 5."; }
  else if (correct >= 4){ verdict = "Непогано, повтори 📘"; advice = "Перечитай про exit code тестів і matrix, тоді перепройди."; }
  else { verdict = "Варто перечитати розділ 🔁"; advice = "Тести — серце CI. Пробіжись по теорії ще раз."; }
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('advice').textContent = advice;
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth', block:'center'});
}
</script>
</body>
</html>
